<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="540" height="190" role="img" aria-label="VIMIA">
<style>
  .traco{stroke-dasharray:1;animation:escrever .7s cubic-bezier(.6,0,.2,1) backwards}
  .entra{transform-box:fill-box;transform-origin:30% 100%;animation:entrar .9s .7s cubic-bezier(.3,1.5,.5,1) backwards}
  .ola{transform-box:fill-box;transform-origin:20% 100%;animation:acenar 7s 1.6s ease-in-out infinite}
  .flutua{animation:flutuar 3.6s ease-in-out infinite}
  .olhos{transform-box:fill-box;transform-origin:50% 70%;animation:piscar 4.8s 2.4s infinite}
  .brilho{transform-box:fill-box;transform-origin:center;animation:brilhar 2.4s ease-in-out infinite}
  @keyframes escrever{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes entrar{from{transform:translateY(24px) scale(.4);opacity:0}to{transform:none;opacity:1}}
  @keyframes acenar{0%,58%,100%{transform:none}63%{transform:rotate(-9deg)}69%{transform:rotate(7deg)}75%{transform:rotate(-5deg)}81%{transform:rotate(3deg)}87%{transform:none}}
  @keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes piscar{0%,44%,52%,100%{transform:none}48%{transform:scaleY(.15)}}
  @keyframes brilhar{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.65}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
